<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Superflow QG</title>
<style>
:root{--ink:#223630;--paper:#f6f5ec;--surface:#fbfaf3;--green:#1f3b33;--green-2:#2e5f4f;--orange:#c46e3c;--line:#d5d8ca;--soft:#eaede1;--muted:#687268;--wait:#8a5a26;--danger:#86513d;--display:"Avenir Next","Century Gothic",sans-serif;--body:"Avenir Next","Gill Sans",sans-serif;--mono:"SFMono-Regular",Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body)}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.skip{position:fixed;top:-60px;left:12px;background:var(--ink);color:white;padding:10px 14px;z-index:100}.skip:focus{top:10px}
.shell{min-height:100dvh;display:grid;grid-template-rows:auto 1fr}.mast{background:var(--green);color:#f3f0df;padding:22px clamp(20px,4vw,56px) 0}.brandline{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:13px}.mark{font:900 32px/1 var(--display);color:var(--orange);transform:skewY(-4deg)}.brand strong{font:800 25px/1 var(--display);letter-spacing:-.6px}.brand small{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#bfcbbc}.project{text-align:right}.project strong{display:block;font:650 15px var(--display)}.project small{font-size:11px;color:#bfcbbc}.tabs{display:flex;gap:7px;margin-top:24px;overflow:auto;padding-bottom:0}.tab{border:0;background:transparent;color:#c8d2c3;padding:12px 15px;border-radius:6px 6px 0 0;white-space:nowrap}.tab span{font:10px var(--mono);margin-left:6px;opacity:.8}.tab[aria-selected=true]{background:var(--paper);color:var(--ink)}
.workspace{width:min(1080px,100%);margin:0 auto;padding:38px clamp(18px,4vw,48px) 70px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}.intro h1{font:750 clamp(32px,5vw,54px)/1 var(--display);letter-spacing:-1.7px;margin:0}.intro p{margin:12px 0 0;color:var(--muted);font-size:14px}.snapshot{font:9px/1.6 var(--mono);color:var(--muted);text-align:right;max-width:250px}.toolbar{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:20px}.search{position:relative;flex:1}.search:before{content:"⌕";position:absolute;left:13px;top:7px;font:22px var(--display);color:var(--muted)}.search input{width:100%;border:1px solid var(--line);background:var(--surface);padding:11px 13px 11px 42px;border-radius:6px}.count{font:10px var(--mono);color:var(--muted);white-space:nowrap}
.list{border-top:1px solid var(--line)}.family{border-bottom:1px solid var(--line)}.spec-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;border:0;background:transparent;text-align:left;padding:18px 4px}.spec-card:hover{background:#eef0e6}.toggle{width:28px;height:28px;border:0;background:transparent;border-radius:4px;font:18px/1 var(--mono);color:var(--muted);display:grid;place-items:center;transition:transform .18s}.toggle[aria-expanded=true]{transform:rotate(90deg)}.toggle.blank{visibility:hidden}.open-spec{border:0;background:transparent;text-align:left;padding:0;min-width:0}.idline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}.id{font:10px var(--mono);color:var(--muted)}.mini-label{font:9px var(--mono);color:var(--green-2);background:#e5ecdf;border:1px solid #cfdac8;padding:2px 5px;border-radius:3px}.title{font:650 17px/1.35 var(--display);letter-spacing:-.15px;overflow-wrap:anywhere}.excerpt{display:block;margin-top:7px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.situation{font-size:11px;white-space:nowrap;padding-top:4px;display:flex;gap:6px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.ready{color:var(--green-2)}.waiting{color:var(--wait)}.blocked{color:var(--danger)}.done{color:#667267}.children{margin:0 0 12px 38px;border-left:2px solid #cbd5c5;padding-left:18px}.children[hidden]{display:none}.children .family{border-bottom:1px solid #e1e4d9}.children .spec-card{padding:13px 4px}.children .title{font-size:14px}.children .children{margin-left:24px}.empty{padding:72px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;font:650 24px var(--display);color:var(--ink);margin-bottom:7px}
.drawer{border:0;border-left:1px solid var(--line);margin:0 0 0 auto;padding:0;width:min(520px,100vw);height:100dvh;max-height:none;background:var(--surface);color:var(--ink);box-shadow:-20px 0 70px #14251f26}.drawer::backdrop{background:#172c2566;backdrop-filter:blur(2px)}.drawer-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:20px 24px 17px;z-index:2}.drawer-top{display:flex;justify-content:space-between;gap:15px;align-items:center}.drawer-id{font:10px var(--mono);color:var(--muted)}.close{border:1px solid var(--line);background:transparent;width:34px;height:34px;border-radius:5px;font-size:20px}.drawer h2{font:720 clamp(27px,4vw,38px)/1.12 var(--display);letter-spacing:-.7px;margin:18px 0 10px;overflow-wrap:anywhere}.drawer-state{display:flex;gap:7px;align-items:center;font-size:12px}.drawer-body{padding:24px 26px 60px}.notice{border-left:3px solid var(--orange);background:#f1ede1;padding:12px 14px;margin-bottom:22px;font-size:12px;color:#5d624f}.dependency{border:1px solid var(--line);background:#f1f3e9;padding:11px 13px;margin:8px 0;border-radius:5px}.dependency strong{font:600 11px var(--mono);display:block}.dependency span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.narrative{font-size:14px;line-height:1.75}.narrative h1,.narrative h2,.narrative h3{font-family:var(--display);line-height:1.25;margin:1.6em 0 .55em}.narrative h1{font-size:25px}.narrative h2{font-size:20px}.narrative h3{font-size:16px}.narrative p{margin:.8em 0}.narrative ul{padding-left:20px}.narrative code{font:12px var(--mono);background:#e9ecdf;padding:2px 4px;border-radius:3px}.narrative pre{font:11px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--green);color:#edf1e6;padding:15px;border-radius:5px;overflow:auto}.narrative blockquote{margin:1em 0;padding-left:14px;border-left:2px solid var(--orange);color:var(--muted)}.no-body{color:var(--muted);font-size:13px;font-style:italic;padding:25px 0}
.diagnostics{margin-top:28px;border:1px solid #dfc5b5;background:#f5e9e0;padding:15px}.diagnostics summary{cursor:pointer;font-weight:600}.diagnostics li{font-size:12px;margin:7px 0}.footer{font:9px var(--mono);color:var(--muted);border-top:1px solid var(--line);margin-top:36px;padding-top:16px}
@media(max-width:680px){.mast{padding-left:16px;padding-right:16px}.project{display:none}.tabs{margin-left:-4px}.tab{padding:11px 10px}.workspace{padding-top:26px}.intro{display:block}.snapshot{text-align:left;margin-top:15px}.toolbar{align-items:stretch;flex-direction:column}.count{align-self:flex-end}.spec-card{grid-template-columns:auto minmax(0,1fr)}.situation{grid-column:2;padding:0}.children{margin-left:18px;padding-left:10px}.drawer{width:100vw;border-left:0}.drawer-body{padding-left:20px;padding-right:20px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{.mast,.toolbar,.toggle,.close{display:none!important}.workspace{padding:20px}.children[hidden]{display:block}.drawer{position:static;width:auto;height:auto;box-shadow:none}.spec-card{break-inside:avoid}}
</style>
</head>
<body>
<a class="skip" href="#main">Pular para as specs</a>
<div class="shell">
  <header class="mast">
    <div class="brandline">
      <div class="brand"><span class="mark">S</span><strong>superflow</strong><small>QG</small></div>
      <div class="project"><strong id="project-name">Specs</strong><small>Retrato atual</small></div>
    </div>
    <nav class="tabs" aria-label="Situação das specs">
      <button class="tab" data-view="open" aria-selected="true">Em aberto <span data-count="open">0</span></button>
      <button class="tab" data-view="ready" aria-selected="false">Pode avançar <span data-count="ready">0</span></button>
      <button class="tab" data-view="waiting" aria-selected="false">Aguardando <span data-count="waiting">0</span></button>
      <button class="tab" data-view="blocked" aria-selected="false">Dependências <span data-count="blocked">0</span></button>
      <button class="tab" data-view="done" aria-selected="false">Concluídas <span data-count="done">0</span></button>
    </nav>
  </header>
  <main class="workspace" id="main">
    <section class="intro">
      <div><h1 id="view-title">Em aberto</h1><p id="view-copy">Escolha uma spec. O contexto completo abre ao lado.</p></div>
      <div class="snapshot" id="snapshot"></div>
    </section>
    <div class="toolbar">
      <label class="search"><span class="skip">Buscar</span><input id="search" type="search" placeholder="Buscar por ID, título ou conteúdo"></label>
      <span class="count" id="visible-count"></span>
    </div>
    <section class="list" id="list" aria-live="polite"></section>
    <details class="diagnostics" id="diagnostics" hidden><summary>Diagnósticos do corpus</summary><ul id="diagnostic-list"></ul></details>
    <footer class="footer">Gerado a partir de status.md · somente leitura · sem tasks ou arquivos internos</footer>
  </main>
</div>
<dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <div class="drawer-top"><span class="drawer-id" id="drawer-id"></span><button class="close" id="close" aria-label="Fechar">×</button></div>
    <h2 id="drawer-title"></h2><div class="drawer-state" id="drawer-state"></div>
  </div>
  <div class="drawer-body"><div id="drawer-context"></div><article class="narrative" id="drawer-content"></article></div>
</dialog>
<script type="application/json" id="qg-snapshot">__QG_SNAPSHOT__</script>
<script>
(()=>{"use strict";
const feed=JSON.parse(document.getElementById("qg-snapshot").textContent),records=Array.isArray(feed.records)?feed.records:[];
const byId=new Map(records.map(r=>[r.id,r])),children=new Map();records.forEach(r=>{if(r.parent_id){const a=children.get(r.parent_id)||[];a.push(r);children.set(r.parent_id,a)}});
const roots=records.filter(r=>!r.parent_id||!byId.has(r.parent_id));let view="open",query="";
const labels={open:["Em aberto","Escolha uma spec. O contexto completo abre ao lado."],ready:["Pode avançar","Pendentes sem espera ou dependência ainda aberta."],waiting:["Aguardando","Pendentes que esperam uma condição concreta."],blocked:["Dependências","Pendentes condicionadas à entrega de outra spec."],done:["Concluídas","Specs que cumpriram o próprio aceite."]};
function unresolved(r){return (r.depends_on||[]).filter(d=>!byId.has(d.id)||byId.get(d.id).status!=="done")}
function situation(r){if(r.status==="done")return"done";if(r.waiting_for)return"waiting";if(unresolved(r).length)return"blocked";return"ready"}
function inView(r){const s=situation(r);return view==="open"?r.status!=="done":s===view}
function searchable(r){return [r.id,r.title,r.body_md,r.waiting_for,...(r.depends_on||[]).flatMap(d=>[d.id,d.reason])].join(" ").toLocaleLowerCase("pt-BR")}
function matches(r){const self=inView(r)&&(!query||searchable(r).includes(query));return self||(children.get(r.id)||[]).some(matches)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function plain(md){return String(md||"").replace(/```[\s\S]*?```/g," ").replace(/[#>*_`\[\]()!-]/g," ").replace(/\s+/g," ").trim()}
function markdown(md){const safe=esc(md).replace(/```([\s\S]*?)```/g,"<pre><code>$1</code></pre>");return safe.split(/\n{2,}/).map(block=>{const b=block.trim();if(!b)return"";if(/^### /.test(b))return"<h3>"+b.slice(4)+"</h3>";if(/^## /.test(b))return"<h2>"+b.slice(3)+"</h2>";if(/^# /.test(b))return"<h1>"+b.slice(2)+"</h1>";if(b.split("\n").every(x=>/^[-*] /.test(x)))return"<ul>"+b.split("\n").map(x=>"<li>"+x.slice(2)+"</li>").join("")+"</ul>";if(/^&gt; /.test(b))return"<blockquote>"+b.replace(/^&gt; /gm,"")+"</blockquote>";return"<p>"+b.replace(/\n/g,"<br>")+"</p>"}).join("").replace(/`([^`]+)`/g,"<code>$1</code>")}
function count(){const c={open:0,ready:0,waiting:0,blocked:0,done:0};records.forEach(r=>{const s=situation(r);c[s]++;if(r.status!=="done")c.open++});Object.entries(c).forEach(([k,v])=>document.querySelector(`[data-count="${k}"]`).textContent=v)}
function card(r,depth=0){const kids=(children.get(r.id)||[]).filter(matches),hasKids=kids.length>0,s=situation(r),excerpt=plain(r.body_md).slice(0,150),stateLabel=s==="ready"?"Pode avançar":s==="waiting"?"Aguardando":s==="blocked"?"Dependência":view==="open"&&hasKids?"Concluída · minispec aberta":"Concluída";const family=document.createElement("article");family.className="family";family.innerHTML=`<div class="spec-card"><button class="toggle ${hasKids?"":"blank"}" aria-label="${hasKids?"Mostrar minispecs":"Sem minispecs"}" aria-expanded="${hasKids&&query?"true":"false"}">›</button><button class="open-spec"><span class="idline"><span class="id">${esc(r.id)}</span>${depth?'<span class="mini-label">minispec</span>':hasKids?'<span class="mini-label">'+kids.length+' minispec'+(kids.length>1?'s':'')+'</span>':''}</span><span class="title">${esc(r.title)}</span>${excerpt?'<span class="excerpt">'+esc(excerpt)+'</span>':''}</button><span class="situation ${s}"><i class="dot"></i>${stateLabel}</span></div>`;
const toggle=family.querySelector(".toggle");if(hasKids){const box=document.createElement("div");box.className="children";box.hidden=!(query);kids.forEach(k=>box.appendChild(card(k,depth+1)));family.appendChild(box);toggle.onclick=e=>{e.stopPropagation();box.hidden=!box.hidden;toggle.setAttribute("aria-expanded",String(!box.hidden))}}family.querySelector(".open-spec").onclick=()=>openDrawer(r);return family}
function render(){document.getElementById("view-title").textContent=labels[view][0];document.getElementById("view-copy").textContent=labels[view][1];const list=document.getElementById("list");list.replaceChildren();const shown=roots.filter(matches);shown.forEach(r=>list.appendChild(card(r)));if(!shown.length)list.innerHTML='<div class="empty"><strong>Nenhuma spec nesta visão.</strong><span>Ajuste a busca ou escolha outro recorte.</span></div>';const total=records.filter(r=>inView(r)&&(query?searchable(r).includes(query):true)).length;document.getElementById("visible-count").textContent=total+" spec"+(total===1?"":"s")}
function openDrawer(r){const s=situation(r);document.getElementById("drawer-id").textContent=r.id;document.getElementById("drawer-title").textContent=r.title;document.getElementById("drawer-state").innerHTML=`<i class="dot ${s}"></i>${s==="ready"?"Pode avançar":s==="waiting"?"Aguardando":s==="blocked"?"Dependência":"Concluída"}`;let context="";if(r.waiting_for)context+=`<div class="notice"><strong>Aguardando</strong><br>${esc(r.waiting_for)}</div>`;const deps=r.depends_on||[];if(deps.length)context+=deps.map(d=>`<div class="dependency"><strong>Depende de ${esc(d.id)}</strong><span>${esc(d.reason)}</span></div>`).join("");document.getElementById("drawer-context").innerHTML=context;document.getElementById("drawer-content").innerHTML=r.body_md.trim()?markdown(r.body_md):'<div class="no-body">Esta spec ainda não possui narrativa no status.</div>';document.getElementById("drawer").showModal();history.replaceState(null,"","#"+encodeURIComponent(r.id))}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{view=t.dataset.view;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));render()});document.getElementById("search").oninput=e=>{query=e.target.value.trim().toLocaleLowerCase("pt-BR");render()};document.getElementById("close").onclick=()=>document.getElementById("drawer").close();document.getElementById("drawer").addEventListener("close",()=>history.replaceState(null,"",location.pathname));
count();document.getElementById("snapshot").textContent=`${records.length} specs · ${feed.source_revision?String(feed.source_revision).slice(0,10):"sem revisão Git"} · ${String(feed.snapshot_id||"").slice(0,10)}`;const ds=Array.isArray(feed.diagnostics)?feed.diagnostics:[];if(ds.length){document.getElementById("diagnostics").hidden=false;document.getElementById("diagnostic-list").innerHTML=ds.map(d=>`<li><strong>${esc(d.code)}</strong> · ${esc(d.path)} · ${esc(d.message)}</li>`).join("")}render();if(location.hash){const id=decodeURIComponent(location.hash.slice(1)),r=byId.get(id);if(r)openDrawer(r)}
})();
</script>
</body>
</html>
