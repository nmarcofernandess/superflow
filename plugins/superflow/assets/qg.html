<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Superflow QG</title>
<style>
:root{--text-xs:12px;--text-sm:14px;--text-base:16px;--text-lg:18px;--text-xl:20px;--text-title:28px;--text-page:36px;--pending:#d6a918;--ink:#223630;--paper:#f6f5ec;--surface:#fbfaf3;--green:#1f3b33;--green-2:#2e5f4f;--orange:#c46e3c;--line:#d5d8ca;--soft:#eaede1;--muted:#687268;--wait:#8a5a26;--danger:#86513d;--display:"Avenir Next","Century Gothic",sans-serif;--body:"Avenir Next","Gill Sans",sans-serif;--mono:"SFMono-Regular",Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 var(--text-base)/1.5 var(--body)}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.skip{position:fixed;top:-60px;left:12px;background:var(--ink);color:white;padding:10px 14px;z-index:100}.skip:focus{top:10px}
.shell{min-height:100dvh;min-width:0;display:grid;grid-template-rows:auto 1fr}.mast{min-width:0;background:var(--green);color:#f3f0df;padding:22px clamp(20px,4vw,56px) 0}.brandline{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:13px}.mark{font:900 32px/1 var(--display);color:var(--orange);transform:skewY(-4deg)}.brand strong{font:800 25px/1 var(--display);letter-spacing:-.6px}.brand small{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#bfcbbc}.project{text-align:right}.project strong{display:block;font:650 15px var(--display)}.project small{font-size:var(--text-xs);color:#bfcbbc}.tabs{display:flex;gap:7px;max-width:100%;margin-top:24px;overflow:auto;padding-bottom:0}.tab{border:0;background:transparent;color:#c8d2c3;padding:12px 15px;border-radius:6px 6px 0 0;white-space:nowrap}.tab span{font:var(--text-xs) var(--mono);margin-left:6px;opacity:.8}.tab[aria-selected=true]{background:var(--paper);color:var(--ink)}
.workspace{width:min(1080px,100%);min-width:0;margin:0 auto;padding:38px clamp(18px,4vw,48px) 70px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}.intro h1{font:650 clamp(28px,4vw,var(--text-page))/1.15 var(--display);letter-spacing:-.6px;margin:0}.intro p{margin:12px 0 0;color:var(--muted);font-size:14px}.snapshot{font:var(--text-xs)/1.6 var(--mono);color:var(--muted);text-align:right;max-width:250px}.toolbar{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:20px}.search{position:relative;flex:1}.search:before{content:"⌕";position:absolute;left:13px;top:7px;font:22px var(--display);color:var(--muted)}.search input{width:100%;border:1px solid var(--line);background:var(--surface);padding:11px 13px 11px 42px;border-radius:6px}.count{font:var(--text-xs) var(--mono);color:var(--muted);white-space:nowrap}
.list{border-top:1px solid var(--line)}.family{border-bottom:1px solid var(--line)}.spec-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;border:0;background:transparent;text-align:left;padding:18px 4px}.spec-card:hover{background:#eef0e6}.card-copy{min-width:0}.card-meta{display:flex;align-items:center;justify-content:flex-end;gap:6px}.mini-progress{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;text-align:right;font-size:var(--text-xs);color:var(--muted)}.mini-dots{display:inline-flex;gap:4px;flex-wrap:wrap}.mini-dot{width:10px;height:10px;flex-shrink:0;border-radius:50%;border:1px solid #879187;display:inline-block}.mini-dot.pending{background:var(--pending);border-color:#9d7b12}.mini-dot.done{background:var(--green-2);border-color:var(--green-2)}.idline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}.id{font:var(--text-xs) var(--mono);color:var(--muted)}.mini-label{font:var(--text-xs) var(--mono);color:var(--green-2);background:#e5ecdf;border:1px solid #cfdac8;padding:2px 5px;border-radius:3px}.title{font:600 var(--text-lg)/1.35 var(--display);letter-spacing:-.15px;overflow-wrap:anywhere}.excerpt{display:block;margin-top:7px;color:var(--muted);font-size:var(--text-sm);overflow-wrap:anywhere}.situation{font-size:var(--text-xs);white-space:nowrap;padding-top:4px;display:flex;gap:6px;align-items:center}.dot{width:10px;height:10px;flex-shrink:0;border-radius:50%;background:currentColor}.pending{color:var(--ink)}.pending>.dot,.dot.pending{background:var(--pending);box-shadow:inset 0 0 0 1px #9d7b12}.done{color:var(--green-2)}.children{margin:0 0 12px 38px;border-left:2px solid #cbd5c5;padding-left:18px}.children .family{border-bottom:1px solid #e1e4d9}.children .spec-card{padding:13px 4px}.children .title{font-size:var(--text-base)}.children .children{margin-left:24px}.empty{padding:72px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;font:650 24px var(--display);color:var(--ink);margin-bottom:7px}
.drawer{border:0;border-left:1px solid var(--line);margin:0 0 0 auto;padding:0;width:min(520px,100vw);height:100dvh;max-height:none;background:var(--surface);color:var(--ink);box-shadow:-20px 0 70px #14251f26}.drawer::backdrop{background:#172c2566;backdrop-filter:blur(2px)}.drawer-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:20px 24px 17px;z-index:2}.drawer-top{display:flex;justify-content:space-between;gap:15px;align-items:center}.drawer-id{font:var(--text-xs) var(--mono);color:var(--muted)}.close{border:1px solid var(--line);background:transparent;width:34px;height:34px;border-radius:5px;font-size:20px}.drawer-head h2{font:650 clamp(24px,3vw,var(--text-title))/1.2 var(--display);letter-spacing:-.3px;margin:18px 0 10px;overflow-wrap:anywhere}.drawer-state{display:flex;gap:7px;align-items:center;font-size:var(--text-sm)}.drawer-body{padding:24px 26px 60px}.notice{border-left:3px solid var(--orange);background:#f1ede1;padding:12px 14px;margin-bottom:22px;font-size:var(--text-sm);color:#5d624f}.relation{display:block;width:100%;text-align:left;cursor:pointer;border:1px solid var(--line);background:#f1f3e9;padding:11px 13px;margin:8px 0;border-radius:5px}.relation strong{font:600 var(--text-sm) var(--body);display:block}.relation span{display:block;font-size:var(--text-sm);color:var(--muted);margin-top:4px}.narrative{font-size:var(--text-base);line-height:1.65}.narrative h1,.narrative h2,.narrative h3,.narrative h4,.narrative h5,.narrative h6,#drawer-context h3{font-family:var(--display);font-weight:600;line-height:1.35;letter-spacing:0;margin:1.25em 0 .5em}#drawer-context h3{font-size:var(--text-lg);margin-top:0}.narrative h1{font-size:var(--text-xl)}.narrative h2{font-size:var(--text-lg)}.narrative h3,.narrative h4,.narrative h5,.narrative h6{font-size:var(--text-base)}.narrative p{margin:.8em 0}.narrative ul{padding-left:20px}.narrative code{font:12px var(--mono);background:#e9ecdf;padding:2px 4px;border-radius:3px}.narrative pre{font:11px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--green);color:#edf1e6;padding:15px;border-radius:5px;overflow:auto}.narrative blockquote{margin:1em 0;padding-left:14px;border-left:2px solid var(--orange);color:var(--muted)}.no-body{color:var(--muted);font-size:var(--text-sm);font-style:italic;padding:25px 0}
.diagnostics{margin-top:28px;border:1px solid #dfc5b5;background:#f5e9e0;padding:15px}.diagnostics summary{cursor:pointer;font-weight:600}.diagnostics li{font-size:var(--text-sm);margin:7px 0}.footer{font:var(--text-xs) var(--mono);color:var(--muted);border-top:1px solid var(--line);margin-top:36px;padding-top:16px}
@media(max-width:680px){.mast{padding-left:16px;padding-right:16px}.project{display:none}.tabs{margin-left:-4px}.tab{padding:11px 10px}.workspace{padding-top:26px}.intro{display:block}.snapshot{text-align:left;margin-top:15px}.toolbar{align-items:stretch;flex-direction:column}.count{align-self:flex-end}.spec-card{grid-template-columns:minmax(0,1fr)}.card-meta{grid-row:1;justify-self:end}.situation{padding:0}.children{margin-left:18px;padding-left:10px}.drawer{width:100vw;border-left:0}.drawer-body{padding-left:20px;padding-right:20px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{.mast,.toolbar,.close{display:none!important}.workspace{padding:20px}.drawer{position:static;width:auto;height:auto;box-shadow:none}.spec-card{break-inside:avoid}}
</style>
</head>
<body>
<a class="skip" href="#main">Pular para as specs</a>
<div class="shell">
  <header class="mast">
    <div class="brandline">
      <div class="brand"><span class="mark">S</span><strong>superflow</strong><small>QG</small></div>
      <div class="project"><strong id="project-name">Specs</strong><small>Retrato atual</small></div>
    </div>
    <nav class="tabs" aria-label="Situação das specs">
      <button class="tab" data-view="open" aria-selected="true">Em aberto <span data-count="open">0</span></button>
      <button class="tab" data-view="done" aria-selected="false">Concluídas <span data-count="done">0</span></button>
    </nav>
  </header>
  <main class="workspace" id="main">
    <section class="intro">
      <div><h1 id="view-title">Em aberto</h1><p id="view-copy">Escolha uma spec. O contexto completo abre ao lado.</p></div>
      <div class="snapshot" id="snapshot"></div>
    </section>
    <div class="toolbar">
      <label class="search"><span class="skip">Buscar</span><input id="search" type="search" placeholder="Buscar por ID, título ou conteúdo"></label>
      <span class="count" id="visible-count"></span>
    </div>
    <section class="list" id="list" aria-live="polite"></section>
    <details class="diagnostics" id="diagnostics" hidden><summary>Diagnósticos do corpus</summary><ul id="diagnostic-list"></ul></details>
    <footer class="footer">Gerado a partir de status.md</footer>
  </main>
</div>
<dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <div class="drawer-top"><span class="drawer-id" id="drawer-id"></span><button class="close" id="close" aria-label="Fechar">×</button></div>
    <h2 id="drawer-title"></h2><div class="drawer-state" id="drawer-state"></div>
  </div>
  <div class="drawer-body"><div id="drawer-context"></div><article class="narrative" id="drawer-content"></article></div>
</dialog>
<script type="application/json" id="qg-snapshot">__QG_SNAPSHOT__</script>
<script>
((root,feed,ids,syncHash)=>{"use strict";
const records=feed.records.filter(r=>ids===null||ids.includes(r.id));
const byId=new Map(records.map(r=>[r.id,r])),children=new Map();records.forEach(r=>{if(r.parent_id){const a=children.get(r.parent_id)||[];a.push(r);children.set(r.parent_id,a)}});
const roots=records.filter(r=>!r.parent_id||!byId.has(r.parent_id));let view="open",query="";
const labels={open:["Em aberto","Escolha uma spec. O contexto completo abre ao lado."],done:["Concluídas","Specs que cumpriram o próprio aceite."]};
function situation(r){return r.status==="done"?"done":"pending"}
function inView(r){return view==="open"?r.status!=="done":r.status==="done"}
function searchable(r){return [r.id,r.title,r.summary,r.body_md,...(r.relations||[]).flatMap(d=>[d.id,d.reason])].join(" ").toLocaleLowerCase("pt-BR")}
function familyInView(r){return inView(r)||(children.get(r.id)||[]).some(familyInView)}
function matches(r){const self=inView(r)&&(!query||searchable(r).includes(query));return self||(children.get(r.id)||[]).some(matches)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function inline(text){return esc(text).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")}
function markdown(md){
 const lines=String(md||"").split("\n"),out=[];let paragraph=[],list=null,code=null;
 const flush=()=>{if(paragraph.length){out.push("<p>"+paragraph.map(inline).join("<br>")+"</p>");paragraph=[]}};
 const closeList=()=>{if(list){out.push("</"+list+">");list=null}};
 for(const line of lines){
  if(/^\s*```/.test(line)){flush();closeList();if(code!==null){out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>");code=null}else code=[];continue}
  if(code!==null){code.push(line);continue}
  if(!line.trim()){flush();closeList();continue}
  const heading=line.match(/^(#{1,6})\s+(.+)$/),item=line.match(/^\s*(?:([-*+])|\d+[.)])\s+(.+)$/);
  if(heading){flush();closeList();const n=heading[1].length;out.push("<h"+n+">"+inline(heading[2])+"</h"+n+">")}
  else if(item){flush();const type=item[1]?"ul":"ol";if(list!==type){closeList();list=type;out.push("<"+list+">")}out.push("<li>"+inline(item[2])+"</li>")}
  else if(/^>\s?/.test(line)){flush();closeList();out.push("<blockquote>"+inline(line.replace(/^>\s?/,""))+"</blockquote>")}
  else {closeList();paragraph.push(line)}
 }
 flush();closeList();if(code!==null)out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>");return out.join("");
}
function count(){const c={open:0,done:0};records.forEach(r=>c[r.status==="done"?"done":"open"]++);Object.entries(c).forEach(([k,v])=>root.querySelector(`[data-count="${k}"]`).textContent=v)}
function card(r,depth=0){
 const allKids=children.get(r.id)||[],ownHit=!query||searchable(r).includes(query),kids=allKids.filter(ownHit?familyInView:matches),s=situation(r);
 const done=allKids.filter(k=>k.status==="done").length,opened=allKids.length-done;
 const progress=allKids.length?`<span class="mini-dots" role="img" aria-label="Minispecs: ${done} concluídas, ${opened} abertas" title="Minispecs: ${done} concluídas · ${opened} abertas">${allKids.slice(0,20).map(k=>`<i class="mini-dot ${situation(k)}" title="${esc(k.title)}: ${k.status==="done"?"concluída":"aberta"}"></i>`).join("")}${allKids.length>20?`<span>+${allKids.length-20}</span>`:""}</span>`:"";
 const family=document.createElement("article");family.className="family";
 family.innerHTML=`<button class="spec-card" type="button"><span class="card-copy"><span class="idline"><span class="id">${esc(r.id)}</span>${depth?'<span class="mini-label">minispec</span>':""}</span><span class="title">${esc(r.title)}</span><span class="excerpt">${esc(r.summary)}</span></span><span class="card-meta"><span class="situation ${s}"><i class="dot"></i>${progress}${s==="pending"?"Em aberto":"Concluída"}</span></span></button>`;
 family.querySelector(".spec-card").onclick=()=>openDrawer(r);
 if(kids.length){const box=document.createElement("div");box.className="children";kids.forEach(k=>box.appendChild(card(k,depth+1)));family.appendChild(box)}
 return family;
}
function render(){root.getElementById("view-title").textContent=labels[view][0];root.getElementById("view-copy").textContent=labels[view][1];const list=root.getElementById("list");list.replaceChildren();const shown=roots.filter(matches);shown.forEach(r=>list.appendChild(card(r)));if(!shown.length)list.innerHTML='<div class="empty"><strong>Nenhuma spec nesta visão.</strong><span>Ajuste a busca ou escolha outro recorte.</span></div>';const total=records.filter(r=>inView(r)&&(query?searchable(r).includes(query):true)).length;root.getElementById("visible-count").textContent=total+" spec"+(total===1?"":"s")}
function openDrawer(r){
 const s=situation(r),drawer=root.getElementById("drawer");
 root.getElementById("drawer-id").textContent=r.id;root.getElementById("drawer-title").textContent=r.title;
 root.getElementById("drawer-state").innerHTML=`<i class="dot ${s}"></i>${s==="pending"?"Em aberto":"Concluída"}`;
 const context=root.getElementById("drawer-context");context.replaceChildren();
 const addRelations=(title,links)=>{if(!links.length)return;const heading=document.createElement("h3");heading.textContent=title;context.appendChild(heading);links.forEach(d=>{const target=byId.get(d.id),button=document.createElement("button");button.className="relation";button.innerHTML=`<strong>${esc(d.id)}${target?" · "+esc(target.title):""}</strong><span>${esc(d.reason)}</span>`;button.disabled=!target;if(target)button.onclick=()=>openDrawer(target);context.appendChild(button)})};
 addRelations("Relações",r.relations||[]);
 addRelations("Referenciada por",records.flatMap(source=>(source.relations||[]).filter(d=>d.id===r.id).map(d=>({id:source.id,reason:d.reason}))));
 root.getElementById("drawer-content").innerHTML=r.body_md.trim()?markdown(r.body_md):'<div class="no-body">Esta spec ainda não possui narrativa no status.</div>';
 if(!drawer.open)drawer.showModal();drawer.scrollTop=0;root.getElementById("close").focus();if(syncHash)history.replaceState(null,"","#"+encodeURIComponent(r.id));
}
root.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{view=t.dataset.view;root.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));render()});root.getElementById("search").oninput=e=>{query=e.target.value.trim().toLocaleLowerCase("pt-BR");render()};root.getElementById("close").onclick=()=>root.getElementById("drawer").close();root.getElementById("drawer").addEventListener("close",()=>{if(syncHash)history.replaceState(null,"",location.pathname+location.search)});
count();root.getElementById("snapshot").textContent=`${records.length} specs · ${feed.source_revision?String(feed.source_revision).slice(0,10):"sem revisão Git"} · ${String(feed.snapshot_id||"").slice(0,10)}`;root.getElementById("snapshot").title=`Gerado em ${feed.generated_at} · snapshot ${feed.snapshot_id}`;const ds=Array.isArray(feed.diagnostics)?feed.diagnostics:[];if(ds.length){root.getElementById("diagnostics").hidden=false;root.getElementById("diagnostic-list").innerHTML=ds.map(d=>`<li><strong>${esc(d.code)}</strong> · ${esc(d.path)} · ${esc(d.message)}</li>`).join("")}render();if(syncHash&&location.hash){let id;try{id=decodeURIComponent(location.hash.slice(1))}catch{id=""}const r=byId.get(id);if(r)openDrawer(r)}
})();
</script>
</body>
</html>
