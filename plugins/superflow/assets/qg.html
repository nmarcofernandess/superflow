<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Superflow · Specs</title>
  <style>
    :root {
      --ink: #253532;
      --muted: #5c6656;
      --line: #d8dcd0;
      --paper: #f4f4ed;
      --green: #257669;
      --orange: #bb5734;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font:
        16px/1.65 "Avenir Next",
        "Segoe UI",
        sans-serif;
    }
    header {
      background: #243631;
      color: #f4f4ed;
      padding: 18px max(24px, calc((100vw - 1120px) / 2));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header strong {
      font-size: 24px;
      letter-spacing: -1px;
    }
    header span {
      font-size: 13px;
      opacity: 0.7;
    }
    main {
      max-width: 1120px;
      margin: auto;
      padding: 32px 24px;
    }
    h1 {
      font-size: 36px;
      letter-spacing: -1.5px;
      margin: 0 0 20px;
    }
    nav {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    button,
    input {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      background: none;
      border: 0;
      padding: 10px 0;
    }
    nav button[aria-pressed="true"] {
      border-bottom: 3px solid var(--orange);
      font-weight: 700;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fcfcf7;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    summary {
      cursor: pointer;
      list-style: none;
    }
    summary::-webkit-details-marker {
      display: none;
    }
    .spec {
      border-top: 1px solid var(--line);
    }
    .spec > summary {
      padding: 17px 8px;
      display: grid;
      grid-template-columns: 20px 1fr auto;
      gap: 12px;
      align-items: start;
    }
    .spec > summary:before {
      content: "›";
      font-size: 24px;
      line-height: 1.4;
    }
    .spec[open] > summary:before {
      transform: rotate(90deg);
    }
    .spec[open] > summary {
      background: #e9eddf;
    }
    .name {
      font-size: 18px;
      font-weight: 650;
      display: block;
    }
    .id {
      font:
        12px/1.6 Menlo,
        monospace;
      color: var(--muted);
    }
    .state {
      font-size: 13px;
      color: var(--green);
      padding-top: 6px;
      text-align: right;
    }
    .content {
      padding: 12px 32px 32px;
      background: #fcfcf7;
    }
    .prose {
      max-width: 78ch;
      overflow-wrap: anywhere;
    }
    .prose h1 {
      font-size: 27px;
      margin-top: 24px;
    }
    .prose h2 {
      font-size: 22px;
      margin: 28px 0 10px;
    }
    .prose h3 {
      font-size: 18px;
      margin: 20px 0 8px;
    }
    .prose p {
      margin: 10px 0;
    }
    .prose pre {
      white-space: pre-wrap;
      background: #f0f1e9;
      padding: 16px;
      font-size: 13px;
    }
    .prose code {
      font-family: Menlo, monospace;
      font-size: 0.85em;
    }
    .prose blockquote {
      border-left: 3px solid var(--line);
      margin: 16px 0;
      padding-left: 16px;
      color: var(--muted);
    }
    .table-wrap {
      overflow: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }
    td,
    th {
      border: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      min-width: 100px;
    }
    a {
      color: var(--green);
      text-underline-offset: 3px;
    }
    .children {
      margin-top: 28px;
    }
    .children > .spec {
      margin-left: 8px;
    }
    .children .content {
      padding-left: 20px;
      padding-right: 12px;
    }
    .secondary {
      margin-top: 22px;
      color: var(--muted);
      font-size: 14px;
    }
    .secondary > summary {
      font-weight: 600;
      padding: 8px 0;
    }
    .notice {
      color: var(--muted);
      font-size: 13px;
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    :focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 4px;
    }
    @media (max-width: 600px) {
      main {
        padding: 24px 14px;
      }
      header {
        padding: 14px;
      }
      .content {
        padding: 12px 16px 24px;
      }
      .spec > summary {
        grid-template-columns: 14px 1fr;
        gap: 8px;
      }
      .state {
        grid-column: 2;
        text-align: left;
        padding: 0;
      }
      nav {
        gap: 14px;
        font-size: 14px;
      }
      .name {
        font-size: 17px;
      }
    }
  </style>
  <header><strong>superflow</strong><span>QG · Specs</span></header>
  <main>
    <h1>Specs</h1>
    <nav aria-label="Visibilidade">
      <button data-view="open" aria-pressed="true">Em aberto</button
      ><button data-view="done" aria-pressed="false">Concluídas</button
      ><button data-view="archived" aria-pressed="false">Arquivadas</button>
    </nav>
    <input
      id="qg-search"
      type="search"
      aria-label="Buscar nas specs"
      placeholder="Buscar por título, ID ou conteúdo…"
    />
    <p id="qg-summary" class="notice"></p>
    <section id="qg-list" aria-label="Specs"></section>
    <footer>
      <button id="qg-prev">← Anteriores</button><span id="qg-page-status"></span
      ><button id="qg-next">Próximas →</button>
    </footer>
    <details class="secondary" id="diagnostics">
      <summary>Sobre esta fotografia</summary>
      <div id="diagnostic-content"></div>
    </details>
  </main>
  <script type="application/json" id="qg-snapshot">
    __QG_SNAPSHOT__
  </script>
  <script type="application/json" id="qg-links">
    __QG_LINKS__
  </script>
  <script>
    "use strict";
    const feed = JSON.parse(document.getElementById("qg-snapshot").textContent),
      links = JSON.parse(document.getElementById("qg-links").textContent),
      records = feed.records || [],
      byId = new Map(records.map((r, i) => [r.id, { ...r, index: i }])),
      children = new Map();
    for (const r of byId.values()) {
      const p =
        byId.has(r.parent_id) && r.parent_id !== r.id ? r.parent_id : null;
      if (!children.has(p)) children.set(p, []);
      children.get(p).push(r);
    }
    const el = (tag, text, cls) => {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = text;
        if (cls) n.className = cls;
        return n;
      },
      list = document.getElementById("qg-list"),
      search = document.getElementById("qg-search");
    let view = "open",
      page = 0;
    const expanded = new Set();
    function inline(n, text, r) {
      const pattern = /\[([^\]]+)\]\(([^)]+)\)|`([^`]+)`|\*\*([^*]+)\*\*/g;
      let pos = 0,
        m;
      while ((m = pattern.exec(text))) {
        n.append(document.createTextNode(text.slice(pos, m.index)));
        if (m[1]) {
          const target = (links.body_links || [])[r.index]?.[m[2]];
          if (target) {
            const a = el("a", m[1]);
            a.href = target;
            a.rel = "noopener noreferrer";
            n.append(a);
          } else n.append(document.createTextNode(m[1] + " (" + m[2] + ")"));
        } else n.append(el(m[3] ? "code" : "strong", m[3] || m[4]));
        pos = pattern.lastIndex;
      }
      n.append(document.createTextNode(text.slice(pos)));
    }
    function markdown(text, r) {
      const out = el("div", undefined, "prose"),
        lines = String(text || "").split("\n");
      let i = 0;
      while (i < lines.length) {
        let s = lines[i];
        if (!s.trim()) {
          i++;
          continue;
        }
        if (/^```/.test(s)) {
          const block = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i]))
            block.push(lines[i++]);
          out.append(el("pre", block.join("\n")));
          i++;
          continue;
        }
        if (
          i + 1 < lines.length &&
          s.includes("|") &&
          /^\s*\|?\s*:?-{3}/.test(lines[i + 1])
        ) {
          const wrap = el("div", undefined, "table-wrap"),
            table = el("table");
          const row = (s, tag) => {
            const tr = el("tr");
            s.trim()
              .replace(/^\||\|$/g, "")
              .split("|")
              .forEach((v) => {
                const c = el(tag);
                inline(c, v.trim(), r);
                tr.append(c);
              });
            table.append(tr);
          };
          row(s, "th");
          i += 2;
          while (i < lines.length && lines[i].includes("|"))
            row(lines[i++], "td");
          wrap.append(table);
          out.append(wrap);
          continue;
        }
        const heading = s.match(/^(#{1,6})\s+(.+)/),
          bullet = s.match(/^\s*(?:[-*+] |\d+\. )(.+)/);
        if (heading) {
          const h = el("h" + heading[1].length);
          inline(h, heading[2], r);
          out.append(h);
          i++;
          continue;
        }
        if (bullet) {
          const ul = el(/^\s*\d/.test(s) ? "ol" : "ul");
          while (i < lines.length) {
            const b = lines[i].match(/^\s*(?:[-*+] |\d+\. )(.+)/);
            if (!b) break;
            const li = el("li");
            inline(li, b[1], r);
            ul.append(li);
            i++;
          }
          out.append(ul);
          continue;
        }
        const p = el(s.startsWith(">") ? "blockquote" : "p");
        inline(p, s.replace(/^>\s?/, ""), r);
        out.append(p);
        i++;
      }
      return out;
    }
    const terminal = (r) =>
      ["done", "cancelled", "skipped"].includes(r.state) ||
      ["done", "cancelled"].includes(r.phase);
    const own = (r) =>
      view === "archived"
        ? r.archived
        : view === "done"
          ? !r.archived && terminal(r)
          : !r.archived && !terminal(r);
    function visible(r, seen = new Set()) {
      if (seen.has(r.id)) return false;
      seen = new Set(seen).add(r.id);
      return own(r) || (children.get(r.id) || []).some((c) => visible(c, seen));
    }
    function matches(r, seen = new Set()) {
      if (seen.has(r.id)) return false;
      seen = new Set(seen).add(r.id);
      const q = search.value.trim().toLocaleLowerCase();
      return (
        !q ||
        [r.id, r.title, r.body_md, JSON.stringify(r.tasks || [])]
          .join(" ")
          .toLocaleLowerCase()
          .includes(q) ||
        (children.get(r.id) || []).some((c) => matches(c, seen))
      );
    }
    const labels = {
      pending: "Pendente",
      executing: "Em execução",
      in_progress: "Em execução",
      blocked: "Aguardando",
      done: "Concluída",
      cancelled: "Cancelada",
      skipped: "Dispensada",
      plan: "Planejamento",
      execute: "Execução",
      qa: "QA",
      build: "Preparação",
      prd: "PRD",
    };
    function spec(r, seen = new Set()) {
      if (seen.has(r.id)) return el("p", "Relação circular: " + r.id);
      seen = new Set(seen).add(r.id);
      const d = el("details", undefined, "spec");
      d.id = r.id;
      const s = el("summary"),
        title = el("span");
      title.append(el("span", r.id, "id"), el("span", r.title, "name"));
      s.append(
        title,
        el(
          "span",
          (labels[r.state] || labels[r.phase] || r.state || r.phase) +
            (own(r) ? "" : " · contexto"),
          "state",
        ),
      );
      d.append(s);
      let built = false;
      const populate = () => {
        if (built) return;
        built = true;
        const body = el("div", undefined, "content");
        body.append(
          markdown(
            r.body_md || "Esta spec ainda não tem uma descrição escrita.",
            r,
          ),
        );
        if ((r.tasks || []).length) {
          const plan = el("details", undefined, "secondary");
          plan.append(el("summary", "Plano · " + r.tasks.length + " tarefas"));
          for (const t of r.tasks)
            plan.append(
              el(
                "p",
                (t.status === "done" ? "✓ " : "○ ") +
                  (t.id || "") +
                  " · " +
                  (t.behavior || t.title || t.description || t.text || "") +
                  " — " +
                  (t.status || ""),
              ),
            );
          body.append(plan);
        }
        const evidence = el("details", undefined, "secondary");
        evidence.append(el("summary", "Referências e andamento"));
        evidence.append(el("p", "Fase: " + (labels[r.phase] || r.phase)));
        if (r.waiting_for)
          evidence.append(
            el("p", "Aguardando: " + JSON.stringify(r.waiting_for)),
          );
        for (const id of r.depends_on || []) {
          const a = el("a", "Depende de " + id);
          a.href = "#" + id;
          evidence.append(a, el("br"));
        }
        for (const [i, ref] of (r.evidence || []).entries()) {
          const href = links.evidence?.[r.index]?.[i];
          if (href) {
            const a = el("a", ref);
            a.href = href;
            evidence.append(a, el("br"));
          } else evidence.append(el("p", String(ref)));
        }
        body.append(evidence);
        const nested = (children.get(r.id) || []).filter(
          (c) => visible(c) && matches(c),
        );
        if (nested.length) {
          const box = el("section", undefined, "children");
          box.append(el("h3", "Minispecs"));
          for (const c of nested) box.append(spec(c, seen));
          body.append(box);
        }
        d.append(body);
      };
      d.addEventListener("toggle", () => {
        if (d.open) {
          expanded.add(r.id);
          populate();
        } else expanded.delete(r.id);
      });
      if (expanded.has(r.id) || search.value.trim()) {
        populate();
        d.open = true;
      }
      return d;
    }
    function render() {
      list.replaceChildren();
      const roots = (children.get(null) || []).filter(
        (r) => visible(r) && matches(r),
      );
      page = Math.min(page, Math.max(0, Math.ceil(roots.length / 50) - 1));
      for (const r of roots.slice(page * 50, page * 50 + 50))
        list.append(spec(r));
      if (!roots.length) list.append(el("p", "Nenhuma spec nesta visão."));
      document.getElementById("qg-summary").textContent =
        roots.length + " specs principais · minispecs dentro de cada spec";
      document.getElementById("qg-page-status").textContent = roots.length
        ? "Página " + (page + 1) + " de " + Math.ceil(roots.length / 50)
        : "";
      document.getElementById("qg-prev").disabled = page === 0;
      document.getElementById("qg-next").disabled =
        (page + 1) * 50 >= roots.length;
      document
        .querySelectorAll("[data-view]")
        .forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.view === view)),
        );
    }
    document.querySelectorAll("[data-view]").forEach(
      (b) =>
        (b.onclick = () => {
          view = b.dataset.view;
          page = 0;
          render();
        }),
    );
    search.oninput = () => {
      page = 0;
      render();
    };
    document.getElementById("qg-prev").onclick = () => {
      page--;
      render();
    };
    document.getElementById("qg-next").onclick = () => {
      page++;
      render();
    };
    function locate() {
      let id;
      try {
        id = decodeURIComponent(location.hash.slice(1));
      } catch {
        return;
      }
      const r = byId.get(id);
      if (!r) return;
      search.value = "";
      view = r.archived ? "archived" : terminal(r) ? "done" : "open";
      let p = r,
        seen = new Set();
      while (p && !seen.has(p.id)) {
        seen.add(p.id);
        expanded.add(p.id);
        if (!byId.has(p.parent_id)) break;
        p = byId.get(p.parent_id);
      }
      const roots = (children.get(null) || []).filter((r) => visible(r));
      page = Math.max(
        0,
        Math.floor(roots.findIndex((x) => x.id === p.id) / 50),
      );
      render();
      document.getElementById(id)?.scrollIntoView?.({ block: "start" });
    }
    window.addEventListener("hashchange", locate);
    document.getElementById("diagnostic-content").textContent = JSON.stringify(
      { snapshot: feed.snapshot_id, diagnostics: feed.diagnostics },
      null,
      2,
    );
    render();
    if (location.hash) locate();
  </script>
</html>
